name: Release Mobile App

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag name (defaults to v<versionName> from build.gradle.kts)"
        required: false
        type: string
      prerelease:
        description: "Mark GitHub release as a pre-release"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Resolve release metadata
        id: meta
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_PRERELEASE: ${{ inputs.prerelease }}
        run: |
          if [ "$EVENT_NAME" = "push" ]; then
            TAG="$REF_NAME"
          elif [ -n "$INPUT_TAG" ]; then
            TAG="$INPUT_TAG"
          else
            VERSION_NAME=$(grep -m1 'versionName' build.gradle.kts | sed -E 's/.*"([^"]+)".*/\1/')
            if [ -z "$VERSION_NAME" ]; then
              echo "Failed to determine versionName from build.gradle.kts" >&2
              exit 1
            fi
            TAG="v${VERSION_NAME}"
          fi

          if [ "$INPUT_PRERELEASE" = "true" ] || printf '%s' "$TAG" | grep -qE -- '-(alpha|beta|rc)'; then
            PRERELEASE="true"
          else
            PRERELEASE="false"
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"
          echo "Resolved release tag: $TAG (prerelease=$PRERELEASE)"

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platforms;android-37.0 build-tools;37.0.0

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build release APK
        run: ./gradlew --no-daemon --console=plain assembleRelease

      - name: Fetch AOSP debug (testkey) signing keys
        run: |
          KEY_DIR="$RUNNER_TEMP/aosp-keys"
          mkdir -p "$KEY_DIR"

          curl -fsSL "https://android.googlesource.com/platform/build/+/refs/heads/main/target/product/security/testkey.pk8?format=TEXT" \
            | base64 -d > "$KEY_DIR/testkey.pk8"
          curl -fsSL "https://android.googlesource.com/platform/build/+/refs/heads/main/target/product/security/testkey.x509.pem?format=TEXT" \
            | base64 -d > "$KEY_DIR/testkey.x509.pem"

          openssl pkey -inform DER -in "$KEY_DIR/testkey.pk8" -noout
          openssl x509 -in "$KEY_DIR/testkey.x509.pem" -noout -subject -fingerprint -sha256
          echo "AOSP_KEY_DIR=$KEY_DIR" >> "$GITHUB_ENV"

      - name: Align and sign release APK with AOSP testkey
        id: sign
        env:
          RELEASE_TAG: ${{ steps.meta.outputs.tag }}
        run: |
          BUILD_TOOLS="$ANDROID_HOME/build-tools/37.0.0"
          UNSIGNED_APK="build/outputs/apk/release/kdeconnect-android-release-unsigned.apk"
          ALIGNED_APK="$RUNNER_TEMP/kdeconnect-android-release-aligned.apk"
          OUT_DIR="$RUNNER_TEMP/release-assets"
          SIGNED_APK="$OUT_DIR/kdeconnect-android-${RELEASE_TAG}.apk"
          MAPPING_SRC="build/outputs/mapping/release/mapping.txt"
          MAPPING_OUT="$OUT_DIR/kdeconnect-android-${RELEASE_TAG}-mapping.txt"

          if [ ! -f "$UNSIGNED_APK" ]; then
            echo "Missing unsigned release APK at $UNSIGNED_APK" >&2
            exit 1
          fi
          if [ ! -f "$MAPPING_SRC" ]; then
            echo "Missing R8 mapping file at $MAPPING_SRC" >&2
            exit 1
          fi

          mkdir -p "$OUT_DIR"
          "$BUILD_TOOLS/zipalign" -P 16 -f 4 "$UNSIGNED_APK" "$ALIGNED_APK"
          "$BUILD_TOOLS/apksigner" sign \
            --key "$AOSP_KEY_DIR/testkey.pk8" \
            --cert "$AOSP_KEY_DIR/testkey.x509.pem" \
            --out "$SIGNED_APK" \
            "$ALIGNED_APK"
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$SIGNED_APK"

          cp "$MAPPING_SRC" "$MAPPING_OUT"

          echo "apk_path=$SIGNED_APK" >> "$GITHUB_OUTPUT"
          echo "mapping_path=$MAPPING_OUT" >> "$GITHUB_OUTPUT"

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kdeconnect-android-${{ steps.meta.outputs.tag }}
          path: |
            ${{ steps.sign.outputs.apk_path }}
            ${{ steps.sign.outputs.mapping_path }}
          retention-days: 14

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: KDE Connect Android ${{ steps.meta.outputs.tag }}
          prerelease: ${{ steps.meta.outputs.prerelease }}
          generate_release_notes: true
          files: |
            ${{ steps.sign.outputs.apk_path }}
            ${{ steps.sign.outputs.mapping_path }}
